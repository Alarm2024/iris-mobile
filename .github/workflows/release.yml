name: Release APK

# A push to main whose app.json version has no release yet builds, signs and
# publishes it as v<version>. Bump "version" in app.json to cut the next one;
# other pushes to main skip in a few seconds. A pushed tag like v0.1.0, or a
# manual run on an existing tag, builds that tag instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      build: ${{ steps.which.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: Which release
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"; BUILD=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"; BUILD=true
          else
            TAG="v$(node -p "require('./app.json').expo.version")"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$TAG is already released — bump version in app.json for the next one."
              BUILD=false
            else
              BUILD=true
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "release $TAG: build=$BUILD"

  release:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.decide.outputs.tag }}
      IRIS_VERSION_CODE: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: Commit being built
        run: echo "IRIS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck && npm test -- --ci
      # The signing key comes from repository secrets, never from the repo.
      # Without them the release is still signed, with a key made on this
      # runner for this one build and then discarded: the APK installs, but a
      # later build will not update it in place (Android needs the same key),
      # and the release notes say so. Set the four secrets for a key you keep.
      - name: Signing key
        env:
          IRIS_KEYSTORE_BASE64: ${{ secrets.IRIS_KEYSTORE_BASE64 }}
          IRIS_KEYSTORE_PASSWORD: ${{ secrets.IRIS_KEYSTORE_PASSWORD }}
          IRIS_KEY_ALIAS: ${{ secrets.IRIS_KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.IRIS_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/iris-release.jks"
          if [ -n "$IRIS_KEYSTORE_BASE64" ]; then
            printf '%s' "$IRIS_KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PW="$IRIS_KEYSTORE_PASSWORD"; ALIAS="$IRIS_KEY_ALIAS"; KEY_PW="$IRIS_KEY_PASSWORD"
            echo "SIGNING_NOTE=Signed with the project's release key (repository secret)." >> "$GITHUB_ENV"
          else
            echo "::warning::Repository signing secrets are not set — signing with a one-time key. See README, Release signing."
            STORE_PW="$(openssl rand -hex 24)"; KEY_PW="$STORE_PW"; ALIAS=iris
            echo "::add-mask::$STORE_PW"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$STORE_PW" -keypass "$KEY_PW" \
              -dname "CN=Iris Desk Voice (one-time key), O=elghaly" 2>/dev/null
            echo "SIGNING_NOTE=Signed with a one-time key made for this build. It installs, but a later build will not update it in place: uninstall this one first." >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
          {
            echo "IRIS_KEYSTORE_PATH=$KS"
            echo "IRIS_KEYSTORE_PASSWORD=$STORE_PW"
            echo "IRIS_KEY_ALIAS=$ALIAS"
            echo "IRIS_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Assemble the signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify the signature is the release key, not the debug key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          mkdir -p out
          cp "$APK" "out/iris-desk-voice-$TAG.apk"
          (cd out && sha256sum "iris-desk-voice-$TAG.apk" > "iris-desk-voice-$TAG.apk.sha256")
          CERT=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(cut -d' ' -f1 out/*.sha256)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # Creates the tag at the commit just built when it does not exist yet.
          target_commitish: ${{ env.IRIS_COMMIT }}
          name: Iris Desk Voice ${{ env.TAG }}
          files: |
            out/iris-desk-voice-${{ env.TAG }}.apk
            out/iris-desk-voice-${{ env.TAG }}.apk.sha256
          body: |
            Android APK for Iris Desk Voice (arm64-v8a and x86_64). **Devnet by default** — mainnet stays off until you turn it on in Settings.

            - Commit: `${{ env.IRIS_COMMIT }}`
            - APK sha256: `${{ env.APK_SHA256 }}`
            - Signing certificate sha256: `${{ env.CERT_SHA256 }}`
            - ${{ env.SIGNING_NOTE }}

            Install: download the APK on the phone, allow "install unknown apps" for the browser, open it. Needs a Mobile Wallet Adapter wallet (Phantom or Solflare) on the same phone.
