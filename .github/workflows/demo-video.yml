name: Demo video

on:
  workflow_dispatch:
  # Re-run after merging demo flow fixes (bump .github/demo-video-trigger on main).
  push:
    branches: [main]
    paths:
      - .github/demo-video-trigger

permissions:
  contents: write

env:
  MWA_TAG: v2.2.0
  IRIS_APK_URL: https://github.com/Alarm2024/iris-mobile/releases/download/v0.1.0/iris-desk-voice-v0.1.0.apk

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME), as the CI
      # android job relies on; setup-android@v3 failed on this runner.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
      - name: Build fakewallet (${{ env.MWA_TAG }})
        run: |
          git clone --depth 1 --branch "${{ env.MWA_TAG }}" https://github.com/solana-mobile/mobile-wallet-adapter.git "$RUNNER_TEMP/mobile-wallet-adapter"
          cd "$RUNNER_TEMP/mobile-wallet-adapter/android"
          # fakewallet has two flavors (v1, legacy) with the same applicationId;
          # build and install only v1, the protocol Iris speaks.
          ./gradlew :fakewallet:assembleV1Debug --no-daemon
          APK="$PWD/fakewallet/build/outputs/apk/v1/debug/fakewallet-v1-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::fakewallet APK not found at $APK"
            find fakewallet/build/outputs -name '*.apk' -print
            exit 1
          fi
          echo "FAKEWALLET_APK=$APK" >> "$GITHUB_ENV"

      # A throwaway devnet wallet that persists between runs in the Actions
      # cache (never in the repo), so it can be funded once at faucet.solana.com.
      # The phrase is masked; the summary shows only the address and a fingerprint.
      - name: Restore demo wallet
        id: wallet-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.iris-demo-wallet
          key: iris-demo-wallet-v1

      - name: Demo wallet (devnet only)
        id: wallet
        run: |
          python3 -m venv "$RUNNER_TEMP/wallet-venv"
          "$RUNNER_TEMP/wallet-venv/bin/pip" install --quiet mnemonic cryptography
          wallet() { "$RUNNER_TEMP/wallet-venv/bin/python" .github/scripts/demo-wallet.py "$@"; }
          SEED_FILE="$HOME/.iris-demo-wallet/seed.txt"
          mkdir -p "$(dirname "$SEED_FILE")"
          chmod 700 "$(dirname "$SEED_FILE")"
          if [[ ! -s "$SEED_FILE" ]]; then
            wallet new > "$SEED_FILE"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$(cat "$SEED_FILE")"
          ADDRESS="$(wallet address "$SEED_FILE")"
          FINGERPRINT="$(wallet fingerprint "$SEED_FILE")"
          rpc() { curl -sS -m 20 https://api.devnet.solana.com -H 'Content-Type: application/json' -d "$1"; }
          LAMPORTS="$(rpc "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getBalance\",\"params\":[\"$ADDRESS\"]}" | jq -r '.result.value // 0')"
          if (( LAMPORTS < 50000000 )); then
            echo "Balance ${LAMPORTS} lamports; asking the devnet faucet:"
            rpc "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"requestAirdrop\",\"params\":[\"$ADDRESS\",1000000000]}" || true
            echo
          fi
          SOL="$(awk -v l="$LAMPORTS" 'BEGIN { printf "%.4f", l / 1e9 }')"
          echo "Demo wallet $ADDRESS (seed fingerprint $FINGERPRINT): $SOL SOL on devnet"
          {
            echo "DEMO_WALLET_SEED_FILE=$SEED_FILE"
            echo "DEMO_WALLET_ADDRESS=$ADDRESS"
          } >> "$GITHUB_ENV"
          {
            echo "### Demo wallet (devnet only)"
            echo "- Address: \`$ADDRESS\`"
            echo "- Seed fingerprint: \`$FINGERPRINT\`"
            echo "- Balance at start: $SOL SOL"
            if (( LAMPORTS < 50000000 )); then
              echo "- Under 0.05 SOL: the demo records the no-funds path. Fund this address at https://faucet.solana.com (devnet), then run the workflow again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install ffmpeg (ffprobe for recording length)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Record demo on emulator (Maestro + screenrecord)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FAKEWALLET_APK: ${{ env.FAKEWALLET_APK }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # The default AVD screen is 320x640: too small to read in a video.
          # Nexus 4 is 768x1280 at xhdpi (384x640 dp), so the layout matches
          # what the flows were written against; pixel_6 was too slow here.
          profile: Nexus 4
          cores: 4
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            chmod +x .github/scripts/demo-emulator.sh
            .github/scripts/demo-emulator.sh

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests/
            demo.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Demo mp4 length
        run: |
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 demo.mp4 | awk '{printf "%.1f", $1}')"
          echo "Recording length: ${DURATION}s"
          echo "DEMO_MP4_SECONDS=$DURATION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: iris-demo-video
          path: demo.mp4
          retention-days: 30

      - name: Attach to demo-video release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view demo-video --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
            gh release create demo-video --repo "$GITHUB_REPOSITORY" --title "Demo video" --notes "Automated README demo recording (devnet, typed input)."
          gh release upload demo-video demo.mp4 --repo "$GITHUB_REPOSITORY" --clobber

      - name: Workflow summary
        run: |
          {
            echo "### Demo video"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- MP4 length: ${DEMO_MP4_SECONDS}s"
            echo "- Artifact: \`iris-demo-video\`"
          } >> "$GITHUB_STEP_SUMMARY"
