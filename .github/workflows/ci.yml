name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Bundle the Android JS (Metro + Hermes)
        run: npx expo export --platform android --output-dir dist-check
        env:
          EXPO_NO_TELEMETRY: 1
      - name: No signing keys or wallet secrets in the tree
        run: |
          if git ls-files | grep -E '\.(jks|keystore|p12|pem)$'; then
            echo "::error::a key file is tracked"; exit 1
          fi
          if git grep -nE '(secretKey|privateKey|mnemonic|seedPhrase)\s*[:=]' -- src App.tsx index.ts; then
            echo "::error::wallet secret material in source"; exit 1
          fi

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IRIS_COMMIT: ${{ github.sha }}
      IRIS_VERSION_CODE: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Assemble release APK (debug-signed on CI; the release workflow signs)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: iris-desk-voice-ci-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
