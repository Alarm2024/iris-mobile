appId: dev.elghaly.irisdeskvoice
---
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Network"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "Hold the mic and talk."
    timeout: 15000
# Deep link routes (React Navigation linking config).
- openLink: irisdeskvoice://settings
- extendedWaitUntil:
    visible: '(?s).*Contacts.*'
    timeout: 15000
- openLink: irisdeskvoice://
- extendedWaitUntil:
    visible: "Connect wallet"
    timeout: 15000
# Hostile deep link: must not open a wallet authorize/sign prompt.
- openLink: irisdeskvoice://wallet/sign
- extendedWaitUntil:
    visible: "Hold the mic and talk."
    timeout: 15000
- assertVisible: "Connect wallet"
- assertNotVisible: "Opening your wallet to approve…"
# MWA transact() with no wallet installed — expect a handled error, app stays up.
- tapOn: "Connect wallet"
- extendedWaitUntil:
    visible: '(?s).*(No Mobile Wallet Adapter wallet|Install Phantom|Solflare).*'
    timeout: 45000
- extendedWaitUntil:
    visible: "Connect wallet"
    timeout: 5000