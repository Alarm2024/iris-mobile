appId: dev.elghaly.irisdeskvoice
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "DEVNET"
    timeout: 60000
- tapOn: "Connect wallet"
- extendedWaitUntil:
    visible: "Authorize"
    timeout: 30000
- tapOn: "Authorize"
- extendedWaitUntil:
    visible:
      id: "Balance"
    timeout: 60000
